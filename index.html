    imgHtml = '<div class="product-color-swatch" style="background:'+hex+';"><div class="swatch-circle" style="background:'+hex+';border-color:rgba(0,0,0,0.1);"></div><span class="swatch-label" style="color:'+textColor+';">'+label.toUpperCase()+'</span></div>';
  }
  var priceDisplay = product ? fmt(product.price) : (localStorage.getItem('adminSlotPrice_'+slotId) ? fmt(localStorage.getItem('adminSlotPrice_'+slotId)) : '—');
  var adminBtn = isAdmin ? '<label class="admin-slot-upload">📷<input type="file" accept="image/*" style="display:none" onchange="adminSlotUpload(this,\''+slotId+'\')"></label>' : '';
  var adminPriceHtml = isAdmin && !product
    ? '<input type="number" placeholder="Set price ₦" value="'+(localStorage.getItem('adminSlotPrice_'+slotId)||'')+'" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(8,247,247,0.3);color:#fff;padding:5px 8px;font-size:11px;margin-top:4px;box-sizing:border-box;" oninput="localStorage.setItem(\'adminSlotPrice_'+slotId+'\',this.value)"/>'
    : '';

  var clickAction = product
    ? 'openSizePickerProduct('+product.id+')'
    : 'openSlotPicker(\''+slotId+'\',\''+label+'\')';
  return '<div class="product-card" onclick="'+clickAction+'">' +
    '<div class="product-img-wrap" style="position:relative;">' + imgHtml + adminBtn + '</div>' +
    '<div class="product-info">' +
      '<div class="product-name">100TH Classic Tee — '+esc(label)+'</div>' +
      '<div class="product-price-row"><span class="product-price">'+priceDisplay+'</span></div>' +
      '<div class="product-rating"><span class="rating-stars">★★★★★</span></div>' +
      adminPriceHtml +
      '<button class="product-add-btn" onclick="event.stopPropagation();'+clickAction+'">ADD TO CART</button>' +
    '</div>' +
  '</div>';
}

// ── LOAD & RENDER HOME PRODUCTS ──────────────────────────────
var _homeFilter = 'all';
var _homeProducts = [];

function filterCat(btn, cat){
  _homeFilter = cat;
  document.querySelectorAll('.jm-cat-pill').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  renderHomeProducts();
}

async function loadHomeProducts(){
  var area=document.getElementById('homeProductArea'); if(!area) return;
  area.innerHTML='<div class="spinner"><div class="spin"></div></div>';
  try{
    _homeProducts = await GET('/products');
    if(State.user){ try{State.wishlist=await GET('/wishlist'); }catch(e){State.wishlist=[];} }
  }catch(e){ _homeProducts=[]; }
  renderHomeProducts();
}

function renderHomeProducts(){
  var area=document.getElementById('homeProductArea'); if(!area) return;
  var prods=_homeProducts;
  var wishIds=(State.wishlist||[]).map(function(p){return p.id;});

  if(_homeFilter!=='all'){
    var filtered=prods.filter(function(p){return p.tags&&p.tags.includes(_homeFilter);});
    var secTitle = _homeFilter==='t-shirts'?'T-SHIRTS': _homeFilter==='new-arrivals'?'JUST IN': _homeFilter==='best-picks'?'BEST PICKS': _homeFilter==='limited-edition'?'LIMITED EDITION':'PRODUCTS';
    area.innerHTML = '<div class="section-header"><h2 class="section-title">'+secTitle+'</h2></div>' +
      '<div class="products-section"><div class="products-grid">' +
      (filtered.length ? filtered.map(function(p){return buildProductCard(p,wishIds.includes(p.id));}).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--grey-mid);padding:40px;">No products in this category yet.</p>') +
      '</div></div>';
    return;
  }

  // Full home layout
  var black = prods.find(function(p){return p.tags&&p.tags.includes('color-black');});
  var white = prods.find(function(p){return p.tags&&p.tags.includes('color-white');});
  var teal  = prods.find(function(p){return p.tags&&p.tags.includes('color-teal');});
  var carton= prods.find(function(p){return p.tags&&p.tags.includes('color-carton');});
  var limited=prods.find(function(p){return p.tags&&p.tags.includes('limited-edition');});
  var bestPicks=prods.filter(function(p){return p.tags&&p.tags.includes('best-picks');});
  var newArrivals=prods.filter(function(p){return p.tags&&p.tags.includes('new-arrivals');});

  var isAdmin = State.user && State.user.is_admin;

  var html='';

  // T-SHIRTS section
  html += '<div class="section-header" id="tshirts-section"><h2 class="section-title">T-SHIRTS</h2></div>';
  html += '<div class="products-section"><div class="products-grid">';
  html += buildColorCard('black','#060606','#fff','Black',black,'tshirt-black');
  html += buildColorCard('white','#f5f5f0','#111','White',white,'tshirt-white');
  html += buildColorCard('teal','#08f7f7','#060606','Teal Green',teal,'tshirt-teal');
  html += buildColorCard('carton','#bb8e51','#fff','Carton',carton,'tshirt-carton');
  html += buildColorCard('limited','linear-gradient(135deg,#060606,#bb8e51)','#fff','Limited',limited,'tshirt-limited');
  html += '</div></div>';

  // BEST PICKS section
  html += '<div class="section-header" id="best-picks-section"><h2 class="section-title">BEST PICKS</h2><button class="section-view-all" onclick="showMoreSection(&quot;bestPicksGrid&quot;,&quot;bp-extra&quot;,this)">VIEW MORE →</button></div>';
  html += '<div class="products-section"><div class="products-grid" id="bestPicksGrid">';
  var bpCount = Math.max(bestPicks.length, 0);
  bestPicks.slice(0,5).forEach(function(p,i){
    var card = buildProductCard(p, wishIds.includes(p.id));
    if(i>=3) card = card.replace('class="product-card"','class="product-card bp-extra" style="display:none;"');
    html += card;
  });
  var bpNeeded = Math.max(0, 5 - bpCount);
  for(var i=0;i<bpNeeded;i++){
    var sc = buildSlotCard('bp-slot-'+(bpCount+i+1),'🧥','Add to "best-picks" tag');
    if(bpCount+i>=3) sc = sc.replace('class="product-card coming-soon-card"','class="product-card coming-soon-card bp-extra" style="display:none;"');
    html += sc;
  }
  html += '</div></div>';

  // JUST IN section
  html += '<div class="section-header" id="new-arrivals-section"><h2 class="section-title">JUST IN</h2><button class="section-view-all" onclick="showMoreSection(&quot;newArrivalsGrid&quot;,&quot;na-extra&quot;,this)">VIEW MORE →</button></div>';
  html += '<div class="products-section"><div class="products-grid" id="newArrivalsGrid">';
  var naCount = Math.max(newArrivals.length, 0);
  newArrivals.slice(0,5).forEach(function(p,i){
    var card = buildProductCard(p, wishIds.includes(p.id));
    if(i>=3) card = card.replace('class="product-card"','class="product-card na-extra" style="display:none;"');
    html += card;
  });
  var naNeeded = Math.max(0, 5 - naCount);
  for(var i=0;i<naNeeded;i++){
    var sc = buildSlotCard('ji-slot-'+(naCount+i+1),'✨','Add to "new-arrivals" tag');
    if(naCount+i>=3) sc = sc.replace('class="product-card coming-soon-card"','class="product-card coming-soon-card na-extra" style="display:none;"');
    html += sc;
  }
  html += '</div></div>';

  // LIMITED EDITION section
  var limitedAll = prods.filter(function(p){return p.tags&&p.tags.includes('limited-edition');});
  if(limitedAll.length || isAdmin){
    html += '<div class="section-header" id="limited-section"><h2 class="section-title">LIMITED EDITION</h2></div>';
    html += '<div class="products-section"><div class="products-grid">';
    var ltdCount = limitedAll.length;
    limitedAll.forEach(function(p){ html += buildProductCard(p,wishIds.includes(p.id)); });
    if(ltdCount<4) for(var i=0;i<4-ltdCount;i++) html += buildSlotCard('ltd-slot-'+(ltdCount+i+1),'⭐','Add to "limited-edition" tag');
    html += '</div></div>';
  }

  if(!prods.length){
    html += '<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.4);">' +
      '<div style="font-size:48px;margin-bottom:12px;">👕</div>' +
      '<div style="font-size:16px;color:#fff;margin-bottom:6px;">Products coming soon</div>' +
      (isAdmin?'<div style="font-size:13px;">Tap "+ Add" in the header to upload your first product</div>':'') +
    '</div>';
  }

  area.innerHTML = html;
}

// ── SIZE PICKER MODAL ──────────────────────────────────────────
var _spProduct = null;
var _spSelectedSize = null;
var _spQty = 1;

// ── SLOT PICKER (for color cards not yet linked to a DB product) ──────────────
function openSlotPicker(slotId, label){
  if(!State.user){ navigate('/login'); return; }
  var price = Number(localStorage.getItem('adminSlotPrice_'+slotId)||0);
  if(!price){ showToast('Product coming soon!'); return; }
  var img = localStorage.getItem('adminSlot_'+slotId)||null;
  _spProduct = {
    id: 'slot-'+slotId,
    title: '100TH Classic Tee — '+label,
    price: price,
    images: img ? [img] : [],
    sizes: ['S','M','L','XL','XXL']
  };
  _spSelectedSize = null; _spQty = 1;
  var modal = document.getElementById('sizePickerModal');
  document.getElementById('spName').textContent = _spProduct.title;
  document.getElementById('spPrice').textContent = fmt(price);
  document.getElementById('spColourBar').style.background = '#060606';
  document.getElementById('spMsg').style.display='none';
  document.getElementById('spViewCart').style.display='none';
  document.getElementById('spAtcBtn').textContent='ADD TO CART';
  document.getElementById('spAtcBtn').disabled=false;
  document.getElementById('spQtyNum').textContent='1';
  var szRow = document.getElementById('spSizes');
  szRow.innerHTML = _spProduct.sizes.map(function(s){ return '<button class="sp-size-btn" data-size="'+s+'" onclick="selectSpSize(this)">'+s+'</button>'; }).join('');
  modal.classList.add('open'); document.body.style.overflow='hidden';
}

async function openSizePickerProduct(productId){
  if(!State.user){ navigate('/login'); return; }
  try {
    _spProduct = await GET('/products/'+productId);
    _spSelectedSize = null; _spQty = 1;
    var modal = document.getElementById('sizePickerModal');
    document.getElementById('spName').textContent = _spProduct.title;
    document.getElementById('spPrice').textContent = fmt(_spProduct.price);
    document.getElementById('spColourBar').style.background = '#060606';
    document.getElementById('spMsg').style.display='none';
    document.getElementById('spViewCart').style.display='none';
    document.getElementById('spAtcBtn').textContent='ADD TO CART';
    document.getElementById('spAtcBtn').disabled=false;
    document.getElementById('spQtyNum').textContent='1';
    var sizes = _spProduct.sizes && _spProduct.sizes.length ? _spProduct.sizes : ['S','M','L','XL','XXL'];
    var szRow = document.getElementById('spSizes');
    szRow.innerHTML = sizes.map(function(s){ return '<button class="sp-size-btn" data-size="'+s+'" onclick="selectSpSize(this)">'+s+'</button>'; }).join('');
    modal.classList.add('open'); document.body.style.overflow='hidden';
  } catch(e){ showToast('Could not load product.'); }
}

function closeSizePicker(){ var m=document.getElementById('sizePickerModal'); if(m){m.classList.remove('open');document.body.style.overflow='';} }
function selectSpSize(btn){ document.querySelectorAll('.sp-size-btn').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active'); _spSelectedSize=btn.dataset.size; }
function spChangeQty(d){ _spQty=Math.max(1,_spQty+d); document.getElementById('spQtyNum').textContent=_spQty; }

async function spAddToCart(){
  if(!_spSelectedSize){ var m=document.getElementById('spMsg'); m.textContent='Please select a size.'; m.style.color='#e53935'; m.style.display='block'; return; }
  var existing = State.cart.find(function(i){ return i.id===_spProduct.id && i.size===_spSelectedSize; });
  if(existing){ existing.qty += _spQty; } else { State.cart.push({id:_spProduct.id,title:_spProduct.title,price:_spProduct.price,image:_spProduct.images&&_spProduct.images[0],size:_spSelectedSize,qty:_spQty}); }
  saveCart(); updateCartBadge();
  var btn=document.getElementById('spAtcBtn'); btn.textContent='ADDED!'; btn.style.background='#08f7f7'; btn.style.color='#000';
  showToast(_spQty+' x '+_spProduct.title+' ('+_spSelectedSize+') added!');
  setTimeout(function(){ closeSizePicker(); btn.style.background=''; btn.style.color=''; openCartDrawer(); }, 900);
}

// ── CART DRAWER (Jumia-style slide-up after Add to Cart) ───────
function openCartDrawer(){
  var existing = document.getElementById('cartDrawerOverlay');
  if(existing) existing.remove();
  var items = State.cart;
  var subtotal = items.reduce(function(s,i){return s+(i.price*i.qty);},0);
  var deliveryFee = subtotal >= 15000 ? 0 : 1200;
  var total = subtotal + deliveryFee;

  var overlay = document.createElement('div');
  overlay.id = 'cartDrawerOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9998;';
  overlay.onclick = function(e){ if(e.target===overlay) closeCartDrawer(); };

  var drawer = document.createElement('div');
  drawer.id = 'cartDrawer';
  drawer.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0f0f0f;border-radius:20px 20px 0 0;border-top:2px solid rgba(8,247,247,0.3);max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);';

    return '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);">' +
      (item.image ? '<img src="'+esc(item.image)+'" style="width:60px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0;"/>' : '<div style="width:60px;height:60px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:4px;flex-shrink:0;">👕</div>') +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:13px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(item.title)+'</div>' +
        '<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">Size: '+esc(item.size)+'</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">' +
          '<button onclick="drawerQty('+idx+',-1)" style="width:26px;height:26px;background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:16px;cursor:pointer;">−</button>' +
          '<span style="color:#fff;font-size:13px;font-weight:600;">'+item.qty+'</span>' +
          '<button onclick="drawerQty('+idx+',1)" style="width:26px;height:26px;background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:16px;cursor:pointer;">+</button>' +
          '<button onclick="drawerRemove('+idx+')" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;margin-left:4px;">Remove</button>' +
        '</div>' +
      '</div>' +
      '<div style="font-family:var(--font-display);font-size:16px;color:var(--accent);flex-shrink:0;">'+fmt(item.price*item.qty)+'</div>' +
    '</div>';
  }).join('');

  drawer.innerHTML =
    '<div style="width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:14px auto 0;"></div>' +
    '<div style="padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-family:var(--font-display);font-size:20px;letter-spacing:0.1em;color:#fff;">MY CART <span style="font-size:13px;color:var(--accent);">('+items.length+')</span></div>' +
      '<button onclick="closeCartDrawer()" style="background:none;border:none;color:rgba(255,255,255,0.5);font-size:22px;cursor:pointer;">✕</button>' +
    '</div>' +
    '<div style="padding:0 20px;">' + itemsHtml + '</div>' +
    '<div style="padding:16px 20px;">' +
      (subtotal < 15000 ? '<div style="background:rgba(8,247,247,0.06);border:1px solid rgba(8,247,247,0.15);padding:10px;font-size:12px;color:var(--accent);margin-bottom:12px;">🚚 Add '+fmt(15000-subtotal)+' more for FREE delivery!</div>' : '<div style="background:rgba(46,125,50,0.1);border:1px solid rgba(46,125,50,0.3);padding:10px;font-size:12px;color:#81c784;margin-bottom:12px;">✅ You qualify for FREE delivery!</div>') +
      '<div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);">' +
        '<span style="color:rgba(255,255,255,0.5);">Subtotal</span><span style="color:#fff;">'+fmt(subtotal)+'</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;">' +
        '<span style="color:rgba(255,255,255,0.5);">Delivery</span><span style="color:'+(deliveryFee===0?'#81c784':'#fff')+'">'+(deliveryFee===0?'FREE':fmt(deliveryFee))+'</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-family:var(--font-display);font-size:20px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.1);">' +
        '<span style="color:#fff;">TOTAL</span><span style="color:var(--accent);">'+fmt(total)+'</span>' +
      '</div>' +
      '<button onclick="closeCartDrawer();navigate(\'/checkout\')" style="width:100%;padding:16px;background:var(--accent);color:#000;font-family:var(--font-display);font-size:20px;letter-spacing:0.12em;border:none;cursor:pointer;margin-bottom:10px;">CHECKOUT →</button>' +
      '<button id="drawerViewCartBtn" style="width:100%;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;">View Full Cart</button>' +
    '</div>';

  overlay.appendChild(drawer);
  document.body.appendChild(overlay);
  document.body.style.overflow='hidden';
  requestAnimationFrame(function(){ drawer.style.transform='translateY(0)'; });
  var cb=document.getElementById('drawerCheckoutBtn');
  var vb=document.getElementById('drawerViewCartBtn');
  if(cb) cb.onclick=function(){ closeCartDrawer(); navigate('/checkout'); };
  if(vb) vb.onclick=function(){ closeCartDrawer(); navigate('/cart'); };
}
function closeCartDrawer(){
  var d=document.getElementById('cartDrawer'); var o=document.getElementById('cartDrawerOverlay');
  if(d) d.style.transform='translateY(100%)';
  setTimeout(function(){ if(o) o.remove(); document.body.style.overflow=''; }, 320);
}
function drawerQty(idx,delta){
  State.cart[idx].qty=Math.max(1,State.cart[idx].qty+delta);
  saveCart(); updateCartBadge(); openCartDrawer();
}
function drawerRemove(idx){
  State.cart.splice(idx,1); saveCart(); updateCartBadge();
  if(State.cart.length===0){ closeCartDrawer(); } else { openCartDrawer(); }
}

// ── WISHLIST ──────────────────────────────────────────────────
async function toggleWishlist(btn, productId){
  if(!State.user){ navigate('/login'); return; }
  var inList = State.wishlist && State.wishlist.some(function(p){return p.id===productId;});
  try {
    if(inList){ await DEL('/wishlist/'+productId); State.wishlist=State.wishlist.filter(function(p){return p.id!==productId;}); btn.textContent='♡'; btn.style.color=''; showToast('Removed from wishlist'); }
    else { await POST('/wishlist/'+productId); State.wishlist.push({id:productId}); btn.textContent='♥'; btn.style.color='#e53935'; showToast('Added to wishlist ♥'); }
  } catch(e){ showToast('Could not update wishlist.'); }
}

var _deliveryFee = 1200;
async function updateDelivery(){
  var state = (document.getElementById('coState')||{}).value||'';
  if(!state) return;
  try {
    var r = await POST('/delivery/estimate', {state:state});
    _deliveryFee = r.fee;
    var di = document.getElementById('deliveryInfo');
    if(di) di.innerHTML = '🚚 Delivery to '+esc(state)+': <strong>'+fmt(r.fee)+'</strong> · Est. '+r.estimated_days+' days';
    var subtotal=State.cart.reduce(function(s,i){return s+(i.price*i.qty);},0);
    var tot=document.getElementById('coTotal'); if(tot) tot.textContent=fmt(subtotal+r.fee);
  }catch(e){}
}

async function submitOrder(){
  var addr=(document.getElementById('coAddr')||{}).value||'';
  var city=(document.getElementById('coCity')||{}).value||'';
  var state=(document.getElementById('coState')||{}).value||'';
  if(!addr||!city||!state){ showToast('Please fill in your delivery address.'); return; }
  try {
    var order = await POST('/orders', {
      items: State.cart.map(function(i){return{product_id:i.id,title:i.title,price:i.price,quantity:i.qty,size:i.size,image:i.image};}),
      delivery_fee: _deliveryFee,
      delivery_address: {address:addr, city:city, state:state}
    });
    var total = State.cart.reduce(function(s,i){return s+(i.price*i.qty);},0) + _deliveryFee;
    var pay = await POST('/payment/paystack/init', {amount:total, email:State.user.email, order_ref:order.order_ref, callback_url:window.location.origin+'/order-success'});
    if(pay.data && pay.data.authorization_url){
      State.cart=[]; saveCart();
      window.location.href = pay.data.authorization_url;
    } else { showToast('Payment init failed. Try again.'); }
  }catch(e){ showToast('Error: '+e.message); }
}

function otpInput(inp, idx){
  var boxes = document.querySelectorAll('.otp-box');
  if(inp.value && idx < 4) boxes[idx+1].focus();
  if(document.querySelectorAll('.otp-box:not([value=""])').length === 5 || Array.from(boxes).filter(function(b){return b.value;}).length===5) verifyOtp();
}
function otpKey(inp, idx, e){
  if(e.key==='Backspace' && !inp.value && idx>0) document.querySelectorAll('.otp-box')[idx-1].focus();
}
function showRegStep1(){
  var s1=document.getElementById('regStep1'); var s2=document.getElementById('regStep2');
  if(s1) s1.style.display=''; if(s2) s2.style.display='none';
}
async function doRegister(){
  var first=(document.getElementById('regFirst')||{}).value||'';
  var last=(document.getElementById('regLast')||{}).value||'';
  var email=(document.getElementById('regEmail')||{}).value||'';
  var pass=(document.getElementById('regPass')||{}).value||'';
  var phone=(document.getElementById('regPhone')||{}).value||'';
  var errEl=document.getElementById('regErr');
  var btn=document.getElementById('regBtn');
  if(!first||!email||!pass){ if(errEl){errEl.textContent='Please fill in all required fields.';errEl.style.display='block';} return; }
  if(btn){ btn.textContent='SENDING...'; btn.disabled=true; }
  try{
    _regData={first_name:first,last_name:last,email:email,password:pass,phone:phone};
    var otpResp=await POST('/auth/send-otp',_regData);
    var s1=document.getElementById('regStep1'); var s2=document.getElementById('regStep2');
    var sub=document.getElementById('regOtpSub');
    if(s1) s1.style.display='none'; if(s2) s2.style.display='';
    var subMsg='We sent a 5-digit code to '+email+'. Check your inbox.';
    // If email is not configured on server, code is returned directly
    if(otpResp && otpResp._dev_code){
      subMsg='Email service not configured. Your code is: <strong style="color:#08f7f7;font-size:22px;letter-spacing:.15em;">'+otpResp._dev_code+'</strong>';
      // Auto-fill the OTP boxes
      setTimeout(function(){
        var boxes=document.querySelectorAll('.otp-box');
        var digits=String(otpResp._dev_code).split('');
        digits.forEach(function(d,i){ if(boxes[i]) boxes[i].value=d; });
      }, 200);
    }
    if(sub) sub.innerHTML=subMsg;
    setTimeout(function(){ var boxes=document.querySelectorAll('.otp-box'); if(boxes[0]&&!otpResp._dev_code) boxes[0].focus(); }, 100);
  }catch(e){
    if(errEl){errEl.textContent=e.message;errEl.style.display='block';}
  }
  if(btn){ btn.textContent='SEND VERIFICATION CODE'; btn.disabled=false; }
}
async function verifyOtp(){
  var boxes=document.querySelectorAll('.otp-box');
  var code=Array.from(boxes).map(function(b){return b.value;}).join('');
  if(code.length<5){ showToast('Enter the full 5-digit code.'); return; }
  var errEl=document.getElementById('regOtpErr');
  try{
    var r=await POST('/auth/verify-otp',{email:_regData.email,code:code});
    localStorage.setItem('100th_token',r.token);
    State.user=r.user;
    showToast('Welcome to 100TH!');
    navigate('/');
  }catch(e){
    if(errEl){errEl.textContent=e.message;errEl.style.display='block';}
    boxes.forEach(function(b){b.value='';b.style.borderColor='#e53935';});
    setTimeout(function(){boxes.forEach(function(b){b.style.borderColor='';});},1000);
    if(boxes[0]) boxes[0].focus();
  }
}

function adminStat(label, val, color){

function renderAdminOrders(){
  if(!_adminOrders.length) return '<div style="text-align:center;padding:40px;color:var(--grey-mid);">No orders yet.</div>';

  _adminOrders.forEach(function(o){
    var isOpen = _adminExpandedOrder===o.order_ref;
    var items = typeof o.items==='string'?JSON.parse(o.items):o.items;
    var addr = o.delivery_address ? (typeof o.delivery_address==='string'?JSON.parse(o.delivery_address):o.delivery_address) : null;
    var statusColor = {pending:'#ffb74d',confirmed:'#08f7f7',shipped:'#7c4dff',delivered:'#4caf50',cancelled:'#e53935'}[o.status]||'#fff';
    var payColor = o.payment_status==='paid'?'#4caf50':'#e53935';

function renderAdminCustomers(){

  var html='';

    html += '<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
      '<div style="min-width:0;">' +
        '<div style="font-size:14px;font-weight:600;">'+esc(c.first_name)+' '+esc(c.last_name)+(c.is_admin?' <span style=\"background:#08f7f7;color:#000;font-size:9px;padding:2px 6px;letter-spacing:.1em;\">ADMIN</span>':'')+'</div>' +
        '<div style="font-size:12px;color:var(--grey-mid);margin-top:3px;">'+esc(c.email)+'</div>' +
        (c.phone?'<div style="font-size:12px;color:var(--grey-mid);">'+esc(c.phone)+'</div>':'') +

function toggleAdminOrder(ref){
  _adminExpandedOrder = _adminExpandedOrder===ref ? null : ref;
  var el=document.getElementById('adminPage');
  if(el) el.innerHTML=renderAdminDashboard();
}

async function adminUpdateStatus(ref, status){
  try{
    await api('PATCH','/admin/orders/'+ref,{status:status});
    var o=_adminOrders.find(function(o){return o.order_ref===ref;});
    if(o) o.status=status;
    showToast('Status updated: '+status);
    var el=document.getElementById('adminPage');
    if(el) el.innerHTML=renderAdminDashboard();
  }catch(e){ showToast('Error: '+e.message); }
}

async function adminUpdatePayment(ref, payment_status){
  try{
    await api('PATCH','/admin/orders/'+ref,{payment_status:payment_status});
    var o=_adminOrders.find(function(o){return o.order_ref===ref;});
    if(o) o.payment_status=payment_status;
    showToast('Payment status updated: '+payment_status);
    var el=document.getElementById('adminPage');
    if(el) el.innerHTML=renderAdminDashboard();
  }catch(e){ showToast('Error: '+e.message); }
}

async function adminUpdateTracking(ref){
  var inp=document.getElementById('track_'+ref);
  if(!inp) return;
  try{
    await api('PATCH','/admin/orders/'+ref,{delivery_tracking:inp.value});
    var o=_adminOrders.find(function(o){return o.order_ref===ref;});
    if(o) o.delivery_tracking=inp.value;
    showToast('Tracking saved!');
  }catch(e){ showToast('Error: '+e.message); }
}

async function loadAdminDashboard(){
  var el=document.getElementById('adminPage');
  if(!el) return;
  el.innerHTML='<div style="text-align:center;padding:60px;"><div class="spin"></div></div>';
  try{ _adminOrders=await GET('/admin/orders'); }catch(e){ _adminOrders=[]; }
  try{ _adminCustomers=await GET('/admin/customers'); }catch(e){ _adminCustomers=[]; }
  el.innerHTML=renderAdminDashboard();
}

function openAddProduct(){ var m=document.getElementById('modalAddProduct'); if(m){m.classList.add('open');document.body.style.overflow='hidden';} }
function closeAddProduct(){ var m=document.getElementById('modalAddProduct'); if(m){m.classList.remove('open');document.body.style.overflow='';} }
function apTab(btn,idx){ document.querySelectorAll('.ap-tab').forEach(function(b){b.classList.remove('active');}); document.querySelectorAll('.ap-panel').forEach(function(p){p.classList.remove('active');}); btn.classList.add('active'); var p=document.getElementById('apPanel'+idx); if(p) p.classList.add('active'); if(idx===3) apBuildSummary(); }
function apToggleTag(btn,t){ btn.classList.toggle('active'); }
function apGetTags(){ var tags=[]; document.querySelectorAll('.ap-tag-btn.active').forEach(function(b){ var m=b.getAttribute('onclick').match(/apToggleTag\(this,'([^']+)'\)/); if(m) tags.push(m[1]); }); return tags; }
function apToggleSize(btn){ btn.classList.toggle('active'); }
function apGetSizes(){ var s=[]; document.querySelectorAll('.ap-size-toggle.active').forEach(function(b){ s.push(b.textContent.trim()); }); return s; }

// Photo grid init
(function initApPhotoGrid(){
  document.addEventListener('DOMContentLoaded',function(){

      (function(idx){
        var slot=document.createElement('div'); slot.className='ap-photo-slot'; slot.dataset.idx=idx;

        grid.appendChild(slot);
      })(i);

window._apPhotos=[];
window._apColourImgs={};
function apPhotoSlotPick(input,idx){ var file=input.files[0]; if(!file) return; var slot=input.closest('.ap-photo-slot'); var img=slot.querySelector('.ap-photo-slot-img'); var prm=slot.querySelector('.ap-photo-slot-prompt'); var reader=new FileReader(); reader.onload=function(e){ img.src=e.target.result; img.style.display='block'; if(prm) prm.style.display='none'; window._apPhotos[idx]={name:file.name,dataUrl:e.target.result}; }; reader.readAsDataURL(file); }
function apPreviewColourImg(input,colorKey){ var file=input.files[0]; if(!file) return; var reader=new FileReader(); reader.onload=function(e){ var img=document.getElementById('apColourImg-'+colorKey); var prm=document.getElementById('apColourPrompt-'+colorKey); if(img){img.src=e.target.result;img.style.display='block';} if(prm) prm.style.display='none'; window._apColourImgs[colorKey]={name:file.name,dataUrl:e.target.result,colorName:input.dataset.color,hex:input.dataset.hex}; showToast('Colour image set for '+input.dataset.color); }; reader.readAsDataURL(file); }

async function apPublish(){
  var btn=document.getElementById('apPublishBtn'); if(btn){btn.disabled=true;btn.textContent='PUBLISHING…';}
  var title=(document.getElementById('apTitle')||{}).value||''; var price=(document.getElementById('apPrice')||{}).value||'0';
  var compare=(document.getElementById('apCompare')||{}).value||''; var desc=(document.getElementById('apDesc')||{}).value||'';
  var tags=apGetTags(); var sizes=apGetSizes();
  if(!title||!price){ showToast('Fill in title and price!'); if(btn){btn.disabled=false;btn.textContent='🚀 PUBLISH LIVE TO YOUR STORE';} return; }
  try{
    var uploadedPhotos=[];
    for(var i=0;i<window._apPhotos.length;i++){
      if(!window._apPhotos[i]) continue;
      var r=await POST('/upload',{image:window._apPhotos[i].dataUrl,folder:'100th-products'});
      uploadedPhotos.push(r.url);
    }
    var uploadedColorImgs={};
    for(var ck in window._apColourImgs){
      var ci=window._apColourImgs[ck];
      var cr=await POST('/upload',{image:ci.dataUrl,folder:'100th-colors'});
      uploadedColorImgs[ck]=cr.url;
    }
    await POST('/products',{title:title,description:desc,price:parseFloat(price),compare_price:compare?parseFloat(compare):null,tags:tags,sizes:sizes,colors:['Black','White','Teal Green','Carton'],images:uploadedPhotos,color_images:uploadedColorImgs});
    showToast('✅ '+title+' is now live!');
    window._apPhotos=[]; window._apColourImgs={};
    closeAddProduct(); navigate('/');
  }catch(e){ showToast('Error: '+e.message); }
  if(btn){btn.disabled=false;btn.textContent='🚀 PUBLISH LIVE TO YOUR STORE';}
}

// ── FLASH TIMER ───────────────────────────────────────────────
(function initFlashTimer(){
  function tick(){ var el=document.getElementById('jmFlashTimer'); if(!el) return; var now=new Date(),end=new Date(now); end.setHours(23,59,59,999); var d=end-now; var h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000); el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  setInterval(tick,1000); document.addEventListener('DOMContentLoaded',tick);
})();

// ── BANNER CAROUSEL INIT ──────────────────────────────────────
function initBanner(){
  var wrap=document.getElementById('bannerWrap'); if(!wrap) return;
  var track=document.getElementById('bannerTrack'); if(!track) return;
  var dots=document.querySelectorAll('.banner-dot');
  var total=document.querySelectorAll('.banner-slide').length;
  var cur=0,startX=0,isDragging=false,timer;
  function goTo(n){ cur=(n+total)%total; track.style.transform='translateX(-'+(cur*100)+'%)'; dots.forEach(function(d,i){d.classList.toggle('active',i===cur);}); }
  dots.forEach(function(d,i){ d.addEventListener('click',function(){goTo(i);reset();}); });
  var prev=document.getElementById('bannerPrev'); var next=document.getElementById('bannerNext');
  if(prev) prev.addEventListener('click',function(){goTo(cur-1);reset();});
  if(next) next.addEventListener('click',function(){goTo(cur+1);reset();});
  track.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;},{passive:true});
  track.addEventListener('touchend',function(e){var dx=startX-e.changedTouches[0].clientX;if(Math.abs(dx)>40){dx>0?goTo(cur+1):goTo(cur-1);reset();}});
  track.addEventListener('mousedown',function(e){startX=e.clientX;isDragging=true;});
  track.addEventListener('mouseup',function(e){if(!isDragging)return;isDragging=false;var dx=startX-e.clientX;if(Math.abs(dx)>40){dx>0?goTo(cur+1):goTo(cur-1);reset();}});
  track.addEventListener('mouseleave',function(){isDragging=false;});
  function reset(){clearInterval(timer);timer=setInterval(function(){goTo(cur+1);},5000);}
  reset();
}

// ── RENDER ENGINE ─────────────────────────────────────────────
async function render(){
  var app=document.getElementById('app');
  app.innerHTML='<div id="menuDrawerMount"></div>';

  var path=location.pathname;
  var content='';

  app.innerHTML = buildMenuDrawer() + buildHeader() + '<div id="pageContent"></div>' + buildSizePickerModal() + buildAddProductModal();
  updateCartBadge();

  // Help modal
  app.innerHTML += '<div class="help-sheet-bg" id="helpSheetBg" onclick="closeHelpModal()"></div><div class="help-sheet" id="helpSheet"><div class="help-sheet-handle"></div><div class="help-sheet-header"><h2 class="help-sheet-title" id="helpSheetTitle"></h2><button class="help-sheet-close" onclick="closeHelpModal()">✕</button></div><div class="help-sheet-body" id="helpSheetBody"></div></div>';

  var pageEl=document.getElementById('pageContent');

  if(path==='/'){
    try {
      pageEl.innerHTML = await buildHome();
    } catch(e) {
      console.error('buildHome error:', e);
      pageEl.innerHTML = '<div style="padding:40px;text-align:center;"><div style="font-size:28px;color:#08f7f7;font-family:sans-serif;margin-bottom:16px;">100TH</div><p style="color:#999;">Loading store...</p></div>';
    }
    try { initBanner(); } catch(e){}
    loadHomeProducts();
  } else if(path==='/login'){
    pageEl.innerHTML = buildLoginPage();
  } else if(path==='/register'){
    pageEl.innerHTML = buildRegisterPage();
  } else if(path==='/account'){
    pageEl.innerHTML = '<div class="spinner"><div class="spin"></div></div>';
    pageEl.innerHTML = await buildAccount();
  } else if(path==='/cart'){
    pageEl.innerHTML = buildCart();
  } else if(path==='/checkout'){
    pageEl.innerHTML = '<div class="spinner"><div class="spin"></div></div>';
    pageEl.innerHTML = await buildCheckout();
  } else if(path==='/order-success'){
    pageEl.innerHTML = buildOrderSuccess();
  } else if(path==='/admin'){
    pageEl.innerHTML = '<div id="adminPage"><div class="spinner"><div class="spin"></div></div></div>';
    var adminContent = await buildAdminDashboard();
    var adminEl = document.getElementById('adminPage');
    if(adminEl) adminEl.innerHTML = adminContent;
  } else {
    pageEl.innerHTML = '<div class="empty" style="margin-top:60px;background:var(--black);min-height:70vh;"><div class="empty-icon">🔍</div><div class="empty-title">404 — Page not found</div><a href="/" data-link style="display:inline-block;margin-top:16px;padding:12px 28px;background:var(--accent);color:#000;font-family:var(--font-display);font-size:16px;letter-spacing:.1em;">HOME</a></div>';
  }

  // Re-wire photo grid after DOM update
  var grid=document.getElementById('apPhotoGrid');
  if(grid && grid.children.length===0){
    for(var i=0;i<8;i++){
      (function(idx){
        var slot=document.createElement('div'); slot.className='ap-photo-slot';
        slot.innerHTML='<input type="file" accept="image/*" style="display:none" onchange="apPhotoSlotPick(this,'+idx+')"/><img class="ap-photo-slot-img" style="display:none;width:100%;height:100%;object-fit:cover;"/><div class="ap-photo-slot-prompt">'+(idx===0?'⭐<br><span style="font-size:9px;display:block;">Cover</span>':'＋')+'</div>';
        slot.addEventListener('click',function(e){ e.currentTarget.querySelector('input[type=file]').click(); });
        grid.appendChild(slot);
      })(i);
    }
  }
}

// ── BOOT ─────────────────────────────────────────────────────
async function boot(){
  var t=localStorage.getItem('100th_token');
  if(t){ try{ State.user=await GET('/auth/me'); }catch(e){ localStorage.removeItem('100th_token'); } }
  try{ await render(); }catch(e){
    console.error('Render error:',e);
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div style="padding:40px;text-align:center;background:#060606;min-height:100vh;color:#fff;"><div style="font-family:sans-serif;"><div style="font-size:28px;color:#08f7f7;margin-bottom:16px;">100TH</div><p style="color:rgba(255,255,255,0.5);margin-bottom:24px;">Store loading...</p><a href="/" style="padding:12px 28px;background:#08f7f7;color:#000;text-decoration:none;font-weight:700;" onclick="location.reload()">RELOAD</a></div></div>';
  }
}

window.onerror = function(msg,src,line,col,err){
  console.error('JS Error:',msg,src,line);
  var app=document.getElementById('app');
  if(app && app.innerHTML.trim()==='') app.innerHTML='<div style="padding:40px;text-align:center;background:#060606;min-height:100vh;color:#fff;"><div style="font-size:28px;color:#08f7f7;margin-bottom:16px;">100TH</div><p style="color:rgba(255,255,255,0.5);margin-bottom:8px;">Something went wrong.</p><p style="color:rgba(255,255,255,0.3);font-size:12px;margin-bottom:24px;">'+msg+'</p><a href="/" style="padding:12px 28px;background:#08f7f7;color:#000;text-decoration:none;font-weight:700;" onclick="location.reload()">RELOAD</a></div>';
};

boot();
</script>

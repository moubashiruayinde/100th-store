<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#060606"/>
<title>100TH Store — Dress Like It Matters</title>
<style>
/* ===========================
   100TH — FULL THEME CSS
=========================== */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap');

:root {
  --black: #060606;
  --white: #ffffff;
  --offwhite: #f5f5f0;
  --grey-light: #e0e0da;
  --grey-mid: #999;
  --accent: #08f7f7;
  --carton: #bb8e51;
  --teal: #08f7f7;
  --font-display: 'Bebas Neue', sans-serif;
  --font-serif: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--offwhite); color: var(--black); font-family: var(--font-body); font-size: 14px; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
button { cursor: pointer; font-family: var(--font-body); }
input, select, textarea { font-family: var(--font-body); }

/* ===== ANNOUNCEMENT BAR ===== */
.announcement-bar {
  background: var(--black); color: var(--white);
  text-align: center; padding: 9px 16px;
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
}

/* ===== HEADER ===== */
.site-header {
  position: sticky; top: 0; z-index: 9000;
  background: var(--black);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 60px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.menu-btn { 
  background: none; border: none; 
  display: flex; flex-direction: column; justify-content: center; gap: 5px; 
  padding: 10px 12px; cursor: pointer; z-index: 300; position: relative; 
  min-width: 44px; min-height: 44px;
}
.menu-btn span { display: block; width: 24px; height: 2.5px; background: var(--white); border-radius: 2px; transition: all 0.2s; }
.site-logo { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.12em; color: var(--white); }
.site-logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 4px; }
.header-icon {
  background: none; border: none; color: var(--white);
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 8px 10px; position: relative; white-space: nowrap;
}
.header-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; flex-shrink: 0; }
.header-icon:hover { color: var(--accent); }
.cart-badge {
  position: absolute; top: 3px; right: 3px;
  background: var(--accent); color: var(--black);
  font-size: 9px; font-weight: 700;
  width: 15px; height: 15px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
/* Sell button — rendered by Shopify only if customer has admin tag */

/* ===== MENU DRAWER ===== */
.menu-drawer { position: fixed; inset: 0; z-index: 10000; pointer-events: none; }
.menu-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.menu-panel {
  position: absolute; top: 0; left: 0; bottom: 0; width: 300px;
  background: var(--black); transform: translateX(-100%);
  transition: transform 0.32s ease;
  border-right: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 40px;
}
.menu-drawer.open { pointer-events: all; }
.menu-drawer.open .menu-overlay { pointer-events: all; }
.menu-drawer.open .menu-overlay { opacity: 1; }
.menu-drawer.open .menu-panel { transform: translateX(0); }
.menu-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);
}
.menu-logo { font-family: var(--font-display); font-size: 22px; color: var(--white); }
.menu-logo span { color: var(--accent); }
.menu-close { background: none; border: none; color: var(--grey-mid); font-size: 20px; line-height: 1; }
.menu-close:hover { color: var(--white); }
.menu-section-title {
  font-size: 9px; letter-spacing: 0.35em; color: var(--accent);
  text-transform: uppercase; padding: 18px 20px 7px;
  border-top: 1px solid rgba(255,255,255,0.05); margin-top: 6px;
}
.menu-section-title:first-of-type { border-top: none; margin-top: 0; }
.menu-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; color: rgba(255,255,255,0.8); font-size: 14px;
  border-left: 2px solid transparent;
}
.menu-link:hover { color: var(--white); border-left-color: var(--accent); background: rgba(255,255,255,0.03); }
.menu-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); }

/* ===== BANNER CAROUSEL (swipeable) ===== */
.banner-wrap {
  position: relative; overflow: hidden;
  background: var(--black); user-select: none; touch-action: pan-y;
}
.banner-track {
  display: flex; transition: transform 0.38s cubic-bezier(.4,0,.2,1); will-change: transform;
}
.banner-slide {
  min-width: 100%; height: 340px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-direction: column; text-align: center;
  padding: 32px 24px; flex-shrink: 0; overflow: hidden;
}
.banner-bg-fallback { position: absolute; inset: 0; }
.banner-slide img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
}
.banner-slide-content { position: relative; z-index: 2; color: var(--white); }
.banner-eyebrow { font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.banner-headline { font-family: var(--font-display); font-size: 64px; line-height: 0.9; letter-spacing: 0.04em; margin-bottom: 12px; }
.banner-sub { font-size: 12px; color: rgba(255,255,255,0.65); letter-spacing: 0.08em; margin-bottom: 20px; }
.banner-cta {
  display: inline-block; border: 1px solid var(--white); background: none;
  padding: 10px 28px; font-family: var(--font-display);
  font-size: 18px; letter-spacing: 0.15em; color: var(--white); cursor: pointer;
}
.banner-cta:hover { background: var(--white); color: var(--black); }
.banner-cta.accent { background: var(--accent); border-color: var(--accent); color: var(--black); }
.banner-cta.accent:hover { background: var(--white); border-color: var(--white); }
.banner-nav {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 7px; z-index: 3;
}
.banner-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); border: none; cursor: pointer; transition: background 0.2s, transform 0.2s; }
.banner-dot.active { background: var(--accent); transform: scale(1.3); }
.banner-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.2);
  color: var(--white); width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; z-index: 3; border-radius: 50%; cursor: pointer;
  transition: background 0.2s;
}
.banner-arrow:hover { background: var(--accent); color: var(--black); border-color: var(--accent); }
.banner-arrow.prev { left: 12px; }
.banner-arrow.next { right: 12px; }

/* edit button (design mode only) */
.banner-edit-btn {
  position: absolute; top: 10px; right: 10px; z-index: 10;
  background: var(--accent); color: var(--black); border: none;
  padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  border-radius: 2px; font-family: var(--font-body);
}

/* ===== BANNER EDITOR PANEL ===== */
.banner-editor-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
  background: #111; border-top: 2px solid var(--accent);
  max-height: 80vh; overflow-y: auto;
}
.banner-editor-inner { padding: 20px; max-width: 560px; margin: 0 auto; }
.banner-editor-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.banner-editor-header h3 { font-family: var(--font-display); font-size: 20px; color: var(--accent); letter-spacing: 0.12em; }
.banner-editor-header button { background: none; border: none; color: var(--white); font-size: 20px; cursor: pointer; }
.banner-editor-tip { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 16px; background: rgba(255,255,255,0.04); padding: 10px 12px; }
.banner-editor-tip strong { color: var(--accent); }
.banner-editor-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.bed-tab {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.6); padding: 7px 16px; font-size: 12px; cursor: pointer;
  font-family: var(--font-body);
}
.bed-tab.active { background: var(--accent); color: var(--black); border-color: var(--accent); font-weight: 600; }
.bed-panel { display: none; }
.bed-panel.active { display: block; }
.bed-field { margin-bottom: 14px; }
.bed-field label { display: block; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 6px; }
.bed-field input[type="text"] {
  width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  color: var(--white); padding: 9px 12px; font-size: 13px; font-family: var(--font-body);
}
.bed-field input[type="text"]:focus { outline: none; border-color: var(--accent); }
.bed-img-upload {
  border: 2px dashed rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
  padding: 20px; text-align: center; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.4);
  transition: border-color 0.2s;
}
.bed-img-upload:hover { border-color: var(--accent); color: var(--accent); }

/* ===== SECTION HEADERS ===== */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 16px 14px;
}
.section-title { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.08em; }
.section-view-all {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--grey-mid); border-bottom: 1px solid var(--grey-mid); padding-bottom: 1px;
  white-space: nowrap;
  background: none; border-top: none; border-left: none; border-right: none;
  cursor: pointer; font-family: inherit;
}
.section-view-all:hover { color: var(--accent); border-color: var(--accent); }

/* ===== CATEGORIES ROW (horizontal scroll) ===== */
.categories-scroll-wrap { padding: 0 16px 28px; }
.categories-scroll {
  display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.categories-scroll::-webkit-scrollbar { display: none; }
.category-pill {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  flex-shrink: 0; cursor: pointer; text-decoration: none;
}
.category-pill-img {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--black);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; border: 2px solid transparent;
  transition: border-color 0.2s;
  overflow: hidden;
}
.category-pill-img img { width: 100%; height: 100%; object-fit: cover; }
.category-pill:hover .category-pill-img { border-color: var(--accent); }
.category-pill-name { font-size: 11px; letter-spacing: 0.08em; text-align: center; white-space: nowrap; }

/* ===== PRODUCT GRID (Jumia-style compact) ===== */
.products-section { padding: 0 16px 32px; }
.products-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 540px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1200px) { .products-grid { grid-template-columns: repeat(5, 1fr); } }

.product-card {
  background: var(--white); border: 1px solid var(--grey-light);
  display: block; position: relative;
  transition: box-shadow 0.2s;
}
.product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }

.product-img-wrap {
  position: relative; background: #f0f0eb;
  aspect-ratio: 1; overflow: hidden;
}
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s; }
.product-card:hover .product-img-wrap img { transform: scale(1.05); }

.product-placeholder {
  width: 100%; height: 100%; min-height: 150px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--grey-mid);
}
/* Color swatch placeholder */
.product-color-swatch {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
}
.swatch-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(0,0,0,0.1); }
.swatch-label { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.1em; color: var(--white); text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

.product-badge {
  position: absolute; top: 8px; left: 8px;
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 3px 7px; font-weight: 700; z-index: 1;
}
.badge-new { background: var(--accent); color: var(--black); }
.badge-sale { background: #e53935; color: var(--white); }
.badge-limited { background: var(--carton); color: var(--white); }

.product-wishlist {
  position: absolute; top: 8px; right: 8px; z-index: 1;
  background: rgba(255,255,255,0.9); border: none;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--grey-mid);
}
.product-wishlist:hover { color: #e53935; background: var(--white); }

.product-info { padding: 8px 10px 10px; }
.product-name { font-size: 12px; font-weight: 500; line-height: 1.4; margin-bottom: 5px; color: var(--black); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.product-price { font-family: var(--font-serif); font-size: 15px; font-weight: 700; }
.product-price-old { font-size: 11px; color: var(--grey-mid); text-decoration: line-through; }
.product-discount { font-size: 10px; color: #e53935; font-weight: 700; }
.product-rating { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.rating-stars { color: var(--carton); font-size: 10px; }
.rating-count { font-size: 10px; color: var(--grey-mid); }
.product-add-btn {
  display: block; width: 100%; background: var(--black); color: var(--white);
  border: none; padding: 8px; font-family: var(--font-display);
  font-size: 14px; letter-spacing: 0.1em; margin-top: 7px;
  text-align: center;
}
.product-add-btn:hover { background: var(--accent); color: var(--black); }

/* ===== T-SHIRT COLOR PICKER PAGE ===== */
.tshirt-page { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
.tshirt-page-title { font-family: var(--font-display); font-size: 36px; letter-spacing: 0.08em; margin-bottom: 6px; }
.tshirt-page-sub { font-size: 13px; color: var(--grey-mid); margin-bottom: 28px; }
.tshirt-colors-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 32px; }
@media (min-width: 600px) { .tshirt-colors-grid { grid-template-columns: repeat(5, 1fr); } }

.tshirt-color-card {
  background: var(--white); border: 2px solid var(--grey-light);
  padding: 16px 10px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, transform 0.2s; display: block;
}
.tshirt-color-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.tshirt-color-card.selected { border-color: var(--accent); }
.tshirt-swatch { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid rgba(0,0,0,0.1); }
.tshirt-color-name { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
.tshirt-hex { font-size: 10px; color: var(--grey-mid); margin-top: 2px; font-family: monospace; }
.tshirt-color-price { font-family: var(--font-serif); font-size: 15px; font-weight: 700; margin-top: 6px; }

/* ===== CUSTOM DESIGN PAGE ===== */
.custom-page { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
.custom-page-title { font-family: var(--font-display); font-size: 36px; letter-spacing: 0.08em; margin-bottom: 6px; }
.custom-page-sub { font-size: 13px; color: var(--grey-mid); margin-bottom: 28px; line-height: 1.7; }
.custom-steps { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
.custom-step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--grey-mid); }
.custom-step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.custom-step.active .custom-step-num { background: var(--accent); color: var(--black); }
.custom-step-line { flex: 1; height: 1px; background: var(--grey-light); min-width: 20px; }

.custom-form { background: var(--white); border: 1px solid var(--grey-light); padding: 24px; }
.form-block { margin-bottom: 22px; }
.form-label { display: block; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
.form-sublabel { font-size: 11px; color: var(--grey-mid); margin-top: -6px; margin-bottom: 10px; }

/* Color picker in custom form */
.color-picker-row { display: flex; gap: 10px; flex-wrap: wrap; }
.color-pick-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.color-pick-btn:hover, .color-pick-btn.selected { border-color: var(--black); transform: scale(1.15); }
.color-pick-btn .check { display: none; font-size: 14px; }
.color-pick-btn.selected .check { display: block; }

/* Upload area */
.upload-box {
  border: 2px dashed var(--grey-mid); padding: 32px 20px;
  text-align: center; cursor: pointer; position: relative;
  transition: border-color 0.2s, background 0.2s;
}
.upload-box:hover { border-color: var(--accent); background: rgba(8,247,247,0.03); }
.upload-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.upload-icon { font-size: 36px; margin-bottom: 10px; }
.upload-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.upload-sub { font-size: 11px; color: var(--grey-mid); }
.upload-preview { max-width: 200px; max-height: 200px; margin: 12px auto 0; border: 1px solid var(--grey-light); display: none; }

/* Size selector */
.size-row { display: flex; gap: 8px; flex-wrap: wrap; }
.size-btn {
  border: 1px solid var(--grey-light); background: var(--white);
  padding: 8px 16px; font-size: 13px; letter-spacing: 0.08em;
  transition: all 0.2s;
}
.size-btn:hover, .size-btn.selected { background: var(--black); color: var(--white); border-color: var(--black); }

.submit-order-btn {
  width: 100%; background: var(--accent); color: var(--black);
  border: none; padding: 16px; font-family: var(--font-display);
  font-size: 24px; letter-spacing: 0.15em; margin-top: 8px;
}
.submit-order-btn:hover { background: var(--black); color: var(--white); }
.submit-order-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== PRODUCT DETAIL PAGE ===== */
.product-page { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; }
.product-page-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 700px) { .product-page-grid { grid-template-columns: 1fr 1fr; } }

.product-gallery { position: relative; }
.product-main-img {
  background: #f0f0eb; aspect-ratio: 1; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 80px; color: var(--grey-mid);
}
.product-main-img img { width: 100%; height: 100%; object-fit: cover; }
.product-thumbnails { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
.product-thumb {
  width: 64px; height: 64px; flex-shrink: 0; background: #f0f0eb;
  border: 2px solid transparent; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.product-thumb:hover, .product-thumb.active { border-color: var(--accent); }
.product-thumb img { width: 100%; height: 100%; object-fit: cover; }

.product-page-info { display: flex; flex-direction: column; gap: 14px; }
.product-page-category { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); }
.product-page-title { font-family: var(--font-serif); font-size: 26px; line-height: 1.3; }
.product-page-price { font-family: var(--font-display); font-size: 36px; letter-spacing: 0.05em; }
.product-page-price-old { font-size: 14px; text-decoration: line-through; color: var(--grey-mid); margin-left: 8px; }
.product-page-desc { font-size: 13px; line-height: 1.8; color: #444; }

.variant-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
.color-variants { display: flex; gap: 8px; flex-wrap: wrap; }
.color-variant-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
}
.color-variant-btn:hover, .color-variant-btn.selected { border-color: var(--black); transform: scale(1.15); }

.atc-row { display: flex; gap: 10px; margin-top: 6px; }
.atc-qty { display: flex; align-items: center; border: 1px solid var(--grey-light); }
.atc-qty button { width: 36px; height: 44px; background: var(--grey-light); border: none; font-size: 18px; font-weight: 600; }
.atc-qty button:hover { background: var(--black); color: var(--white); }
.atc-qty span { width: 40px; text-align: center; font-weight: 600; font-size: 15px; }
.atc-btn {
  flex: 1; background: var(--accent); color: var(--black);
  border: none; font-family: var(--font-display); font-size: 22px;
  letter-spacing: 0.12em; padding: 0 20px; height: 44px;
}
.atc-btn:hover { background: var(--black); color: var(--white); }
.wishlist-btn {
  width: 44px; height: 44px; border: 1px solid var(--grey-light);
  background: var(--white); font-size: 18px; display: flex; align-items: center; justify-content: center;
}
.wishlist-btn:hover { border-color: #e53935; color: #e53935; }

.product-meta-row { display: flex; flex-direction: column; gap: 7px; padding-top: 10px; border-top: 1px solid var(--grey-light); }
.product-meta-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444; }
.product-meta-item span:first-child { font-size: 16px; }

/* ===== SELLER SUPPORT SECTION ===== */
.seller-support-section { background: var(--black); padding: 40px 16px; }
.seller-support-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 800px; }
@media (max-width: 600px) { .seller-support-inner { grid-template-columns: 1fr; } }
.sidebar-label { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.seller-list { display: flex; flex-direction: column; gap: 4px; }
.seller-list a {
  font-size: 13px; color: rgba(255,255,255,0.72);
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 8px;
}
.seller-list a::before { content: '→'; color: var(--accent); font-size: 10px; }
.seller-list a:hover { color: var(--white); }
.yt-block {
  background: #111; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  padding: 24px 16px; text-align: center; border: none; width: 100%;
  color: var(--white); font-family: var(--font-body); cursor: pointer;
}
.yt-block:hover { background: #1a1a1a; }
.yt-play { width: 44px; height: 44px; border-radius: 50%; background: #FF0000; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.yt-block p { font-size: 11px; color: var(--grey-mid); line-height: 1.5; }

/* ===== TESTIMONIALS ===== */
.testimonials-section { background: var(--black); padding: 48px 16px; border-top: 1px solid rgba(255,255,255,0.05); }
.testimonials-section .section-title { color: var(--white); font-size: 28px; }
.testi-subline { font-size: 10px; letter-spacing: 0.2em; color: var(--grey-mid); text-transform: uppercase; margin-top: 4px; margin-bottom: 24px; }
.testimonials-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 700px) { .testimonials-grid { grid-template-columns: repeat(3, 1fr); } }
.testi-card { border: 1px solid rgba(255,255,255,0.09); padding: 20px; background: rgba(255,255,255,0.02); }
.testi-imgs { display: flex; gap: 7px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.testi-imgs::-webkit-scrollbar { display: none; }
.testi-thumb { width: 62px; height: 62px; flex-shrink: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.2); font-size: 20px; overflow: hidden; }
.testi-thumb img { width: 100%; height: 100%; object-fit: cover; }
.stars { color: var(--carton); font-size: 11px; margin-bottom: 8px; }
.testi-quote { font-size: 12px; line-height: 1.75; color: rgba(255,255,255,0.7); font-style: italic; margin-bottom: 14px; }
.testi-meta { display: flex; align-items: center; gap: 9px; }
.testi-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--white); }
.testi-name { font-size: 12px; font-weight: 600; color: var(--white); }
.testi-via { font-size: 10px; color: var(--grey-mid); }
.testi-tags { display: flex; gap: 5px; margin-top: 10px; }
.testi-tag { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); padding: 3px 7px; color: var(--grey-mid); }

/* ===== HEX SEARCH ===== */
.hex-search-bar {
  background: var(--black); padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.hex-input {
  flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  padding: 8px 14px; color: var(--white); font-family: monospace; font-size: 13px;
  outline: none; letter-spacing: 0.1em; max-width: 240px;
}
.hex-input::placeholder { color: rgba(255,255,255,0.3); }
.hex-input:focus { border-color: var(--accent); }
.hex-preview { width: 30px; height: 30px; border-radius: 50%; background: var(--grey-light); border: 2px solid rgba(255,255,255,0.15); flex-shrink: 0; transition: background 0.2s; }
.hex-result-label { font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }


/* ── PREMADE DESIGN UPLOAD BUTTON (admin only) ── */
.premade-upload-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: var(--black);
  font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
  padding: 7px 14px; cursor: pointer; margin-top: 8px;
  border: none; text-transform: uppercase;
  transition: opacity 0.2s;
}
.premade-upload-btn:hover { opacity: 0.85; }

/* ===== FOOTER ===== */
footer { background: var(--black); color: var(--white); border-top: 1px solid rgba(255,255,255,0.07); padding: 40px 16px 24px; }
.footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 28px; }
@media (min-width: 700px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.footer-brand { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.1em; margin-bottom: 5px; }
.footer-brand span { color: var(--accent); }
.footer-tagline { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--grey-mid); margin-bottom: 12px; }
.footer-desc { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.75; }
.footer-col-title { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.footer-links { display: flex; flex-direction: column; gap: 8px; }
.footer-links a { font-size: 13px; color: rgba(255,255,255,0.5); }
.footer-links a:hover { color: var(--white); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; }

/* ===== MODALS ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { background: #0f0f0f; color: var(--white); width: 100%; max-width: 420px; padding: 32px 24px; position: relative; border: 1px solid rgba(255,255,255,0.08); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.1em; margin-bottom: 4px; }
.modal-sub { font-size: 11px; color: var(--grey-mid); letter-spacing: 0.12em; margin-bottom: 24px; }
.modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 20px; color: var(--grey-mid); }
.modal-close:hover { color: var(--white); }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 5px; color: rgba(255,255,255,0.7); }
.form-field input, .form-field select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); padding: 11px 13px; color: var(--white); font-size: 14px; outline: none; }
.form-field input:focus, .form-field select:focus { border-color: var(--accent); }
.btn-primary { width: 100%; background: var(--accent); color: var(--black); border: none; padding: 13px; font-family: var(--font-display); font-size: 20px; letter-spacing: 0.15em; }
.btn-primary:hover { background: var(--white); }
.modal-switch { margin-top: 14px; text-align: center; font-size: 12px; color: var(--grey-mid); }
.modal-switch a { color: var(--accent); border-bottom: 1px solid var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.success-notice { background: #1a3a1a; border: 1px solid #2d6a2d; color: #7dba7d; padding: 10px 14px; font-size: 12px; margin-bottom: 14px; display: none; }

/* ===== ADD PRODUCT MODAL ===== */
.add-product-modal { max-width: 540px; }
.upload-area-sm { border: 1px dashed var(--grey-mid); padding: 16px; text-align: center; cursor: pointer; font-size: 12px; color: var(--grey-mid); margin-bottom: 14px; position: relative; }
.upload-area-sm input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-area-sm:hover { border-color: var(--accent); color: var(--accent); }

/* ===== TOAST ===== */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--black); color: var(--white); padding: 11px 24px;
  font-size: 13px; letter-spacing: 0.08em; z-index: 9999; opacity: 0;
  pointer-events: none; border: 1px solid rgba(255,255,255,0.12);
  transition: opacity 0.3s, transform 0.3s; white-space: nowrap;
}

/* ===== CART PAGE ===== */
.cart-page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
.cart-header-bar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--black); padding-bottom: 12px; }
.cart-title { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.08em; }
.cart-item-count { font-size: 12px; color: var(--grey-mid); }
.cart-empty { text-align: center; padding: 64px 16px; }
.cart-empty-icon { font-size: 64px; margin-bottom: 14px; }
.cart-empty-title { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.08em; margin-bottom: 8px; }
.cart-empty-sub { color: var(--grey-mid); font-size: 13px; margin-bottom: 24px; }
.cart-shop-btn { display: inline-block; background: var(--black); color: var(--white); padding: 13px 36px; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.15em; }
.cart-shop-btn:hover { background: var(--accent); color: var(--black); }
.cart-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
@media (max-width: 800px) { .cart-layout { grid-template-columns: 1fr; } }
.cart-delivery-bar { background: #f0f8f0; border: 1px solid #c3e6c3; padding: 10px 14px; font-size: 12px; display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.cart-item { display: grid; grid-template-columns: 22px 90px 1fr 110px; gap: 12px; align-items: start; background: var(--white); border: 1px solid var(--grey-light); padding: 14px; margin-bottom: 10px; }
@media (max-width: 560px) { .cart-item { grid-template-columns: 22px 80px 1fr; } .cart-item-price-col { display: none; } .cart-item-price-mobile { display: flex !important; } }
.item-checkbox { width: 15px; height: 15px; accent-color: var(--black); margin-top: 3px; }
.cart-item-img-wrap { background: var(--grey-light); aspect-ratio: 1; overflow: hidden; display: block; }
.cart-item-img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-img-placeholder { width: 100%; height: 100%; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.cart-item-name { display: block; font-size: 13px; font-weight: 500; color: var(--black); margin-bottom: 4px; line-height: 1.4; }
.cart-item-name:hover { color: var(--accent); }
.cart-item-seller { font-size: 10px; color: var(--grey-mid); margin-bottom: 5px; }
.cart-item-seller span { color: var(--accent); }
.cart-item-variant { font-size: 10px; color: var(--grey-mid); background: var(--grey-light); display: inline-block; padding: 2px 7px; margin-bottom: 7px; }
.stock-badge { font-size: 10px; font-weight: 600; display: inline-block; margin-bottom: 8px; }
.in-stock { color: #2e7d32; } .low-stock { color: #e65100; }
.cart-item-price-mobile { display: none; gap: 6px; align-items: center; font-family: var(--font-serif); font-size: 14px; font-weight: 700; margin-bottom: 7px; }
.cart-item-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.qty-control { display: flex; align-items: center; border: 1px solid var(--grey-light); }
.qty-btn { width: 28px; height: 28px; background: var(--grey-light); border: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.qty-btn:hover { background: var(--black); color: var(--white); }
.qty-val { width: 34px; text-align: center; font-size: 13px; font-weight: 600; border-left: 1px solid var(--grey-light); border-right: 1px solid var(--grey-light); line-height: 28px; }
.cart-remove-btn, .cart-save-btn { background: none; border: none; font-size: 11px; color: var(--grey-mid); padding: 0; }
.cart-remove-btn:hover { color: #c0392b; } .cart-save-btn:hover { color: var(--accent); }
.cart-item-price-col { text-align: right; }
.cart-item-price { font-family: var(--font-serif); font-size: 16px; font-weight: 700; }
.cart-item-price-old { font-size: 11px; color: var(--grey-mid); text-decoration: line-through; }
.cart-item-discount { font-size: 10px; color: #2e7d32; font-weight: 600; }
.cart-continue { padding: 12px 0; border-top: 1px solid var(--grey-light); }
.cart-continue-link { font-size: 12px; letter-spacing: 0.1em; color: var(--grey-mid); border-bottom: 1px solid var(--grey-mid); }
.cart-continue-link:hover { color: var(--black); border-color: var(--black); }
.cart-summary-col { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 10px; }
.cart-summary-section-title { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.25em; margin-bottom: 12px; }
.cart-coupon-box, .cart-summary-box, .cart-seller-note { background: var(--white); border: 1px solid var(--grey-light); padding: 16px; }
.coupon-row { display: flex; gap: 7px; }
.coupon-input { flex: 1; border: 1px solid var(--grey-light); padding: 9px 11px; font-size: 12px; outline: none; text-transform: uppercase; letter-spacing: 0.1em; }
.coupon-input:focus { border-color: var(--black); }
.coupon-btn { background: var(--black); color: var(--white); border: none; padding: 9px 14px; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.1em; }
.coupon-btn:hover { background: var(--accent); color: var(--black); }
.coupon-msg { font-size: 11px; margin-top: 6px; }
.coupon-msg.success { color: #2e7d32; } .coupon-msg.error { color: #c0392b; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--grey-light); }
.summary-row:last-of-type { border-bottom: none; }
.discount-row { color: #c0392b; }
.free-delivery { color: #2e7d32; font-weight: 700; }
.summary-divider { height: 2px; background: var(--black); margin: 6px 0; }
.total-row { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.08em; border-bottom: none !important; padding: 10px 0 3px; }
.summary-savings { background: #f0f8f0; border: 1px solid #c3e6c3; padding: 9px 11px; font-size: 11px; color: #2e7d32; font-weight: 600; margin: 10px 0; }
.checkout-btn { display: block; background: var(--accent); color: var(--black); text-align: center; padding: 14px; font-family: var(--font-display); font-size: 20px; letter-spacing: 0.15em; margin-top: 14px; font-weight: 700; }
.checkout-btn:hover { background: var(--black); color: var(--white); }
.secure-badge { text-align: center; font-size: 10px; color: var(--grey-mid); letter-spacing: 0.1em; margin-top: 8px; }
.payment-methods { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; justify-content: center; }
.pay-method { border: 1px solid var(--grey-light); padding: 3px 9px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); }
.seller-guarantee-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--grey-light); }
.seller-guarantee-item:last-child { border-bottom: none; }

/* ===== AUTH PAGES ===== */
.auth-page {
  min-height: 80vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 16px;
  background: var(--offwhite);
}
.auth-card {
  background: var(--black); color: var(--white);
  width: 100%; max-width: 420px;
  padding: 36px 28px;
  border: 1px solid rgba(255,255,255,0.08);
}
.auth-back {
  display: inline-block; font-size: 11px; letter-spacing: 0.15em;
  color: var(--grey-mid); margin-bottom: 20px;
}
.auth-back:hover { color: var(--white); }
.auth-logo {
  font-family: var(--font-display); font-size: 30px;
  letter-spacing: 0.12em; color: var(--white); margin-bottom: 16px;
}
.auth-logo span { color: var(--accent); }
.auth-title {
  font-family: var(--font-display); font-size: 32px;
  letter-spacing: 0.1em; margin-bottom: 6px;
}
.auth-sub {
  font-size: 12px; color: var(--grey-mid);
  letter-spacing: 0.05em; margin-bottom: 24px; line-height: 1.6;
}
.auth-field { margin-bottom: 14px; }
.auth-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.auth-field label {
  display: block; font-size: 9px; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 5px;
}
.auth-field input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 11px 13px; color: var(--white); font-size: 14px;
  outline: none; font-family: var(--font-body);
}
.auth-field input:focus { border-color: var(--accent); }
.auth-forgot { text-align: right; margin-bottom: 16px; }
.auth-forgot a { font-size: 11px; color: var(--grey-mid); }
.auth-forgot a:hover { color: var(--accent); }
.auth-btn {
  width: 100%; background: var(--accent); color: var(--black);
  border: none; padding: 13px; font-family: var(--font-display);
  font-size: 22px; letter-spacing: 0.15em; margin-bottom: 12px;
}
.auth-btn:hover { background: var(--white); }
.auth-divider {
  text-align: center; position: relative; margin: 16px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.auth-divider span {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  background: var(--black); padding: 0 10px;
  font-size: 11px; color: var(--grey-mid);
}
.auth-switch { font-size: 13px; color: var(--grey-mid); text-align: center; }
.auth-switch a { color: var(--accent); border-bottom: 1px solid var(--accent); }
.auth-otp-note {
  margin-top: 20px; background: rgba(8,247,247,0.06);
  border: 1px solid rgba(8,247,247,0.15);
  padding: 12px 14px; font-size: 12px;
  color: rgba(255,255,255,0.6); line-height: 1.7;
  border-radius: 2px;
}
.auth-otp-note strong { color: var(--accent); }

/* Shopify default error styling */
.errors { background: #2a0a0a; border: 1px solid #6a1a1a; padding: 12px 16px; margin-bottom: 16px; }
.errors ul { list-style: none; }
.errors li { font-size: 13px; color: #ff8a8a; }

/* sell-btn visible state */
.sell-btn {
  display: flex;
  background: var(--accent); color: var(--black);
  border: none; padding: 7px 12px;
  font-family: var(--font-display); font-size: 15px;
  letter-spacing: 0.1em; align-items: center; gap: 5px;
  cursor: pointer;
}
.sell-btn:hover { background: var(--carton); color: var(--white); }

/* ===== CATEGORY PILL BUTTON ===== */
.cat-pill-btn {
  background: none; border: none; padding: 0;
  font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  flex-shrink: 0; cursor: pointer;
}

/* ===== CATEGORY MODAL ===== */
.cat-modal-bg { align-items: flex-end; padding: 0; }
@media (min-width: 600px) { .cat-modal-bg { align-items: center; padding: 16px; } }
.cat-modal {
  max-width: 560px; width: 100%;
  border-radius: 12px 12px 0 0; padding: 28px 20px 32px;
  animation: slideUp 0.3s ease;
}
@media (min-width: 600px) { .cat-modal { border-radius: 4px; animation: none; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.cat-modal-title {
  font-family: var(--font-display); font-size: 28px; letter-spacing: 0.1em;
  color: var(--white); margin-bottom: 4px;
}
.cat-product-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin: 20px 0;
}
@media (min-width: 400px) { .cat-product-grid { grid-template-columns: repeat(3, 1fr); } }
.cat-product-card {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column;
}
.cat-product-thumb {
  aspect-ratio: 1; background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; overflow: hidden;
}
.cat-product-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cat-product-info { padding: 8px 10px 10px; }
.cat-product-name { font-size: 11px; color: rgba(255,255,255,0.8); line-height: 1.4; margin-bottom: 4px; }
.cat-product-price { font-size: 13px; font-weight: 600; color: var(--accent); }
.cat-modal-shop-btn {
  display: block; text-align: center;
  background: var(--accent); color: var(--black);
  font-family: var(--font-display); font-size: 18px; letter-spacing: 0.15em;
  padding: 12px; margin-top: 4px;
}
.cat-modal-shop-btn:hover { background: var(--white); }

/* ===== CUSTOM DESIGN GRID (3 boxes) ===== */
.custom-design-grid {
  grid-template-columns: repeat(3, 1fr) !important;
}
.custom-placeholder {
  width: 100%; height: 100%; min-height: 140px;
  background: linear-gradient(135deg, #0a0a0a, #1a0e00);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 12px;
}
.custom-placeholder-icon { font-size: 36px; }
.custom-placeholder-label {
  font-family: var(--font-display); font-size: 14px; letter-spacing: 0.12em;
  color: var(--accent);
}
.custom-placeholder-hint { font-size: 9px; color: rgba(255,255,255,0.35); text-align: center; line-height: 1.4; }

/* ===== VIEW MORE BUTTON ===== */
.hidden-product { display: none !important; }
.view-more-wrap { text-align: center; padding: 8px 0 4px; }
.view-more-btn {
  background: none; border: 1px solid var(--black);
  font-family: var(--font-display); font-size: 16px; letter-spacing: 0.18em;
  color: var(--black); padding: 10px 32px; cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.view-more-btn:hover { background: var(--black); color: var(--white); }
.view-more-btn.hidden { display: none; }

/* ===== NEED HELP ACCORDION ===== */
.help-list { display: flex; flex-direction: column; }
.help-item { border-bottom: 1px solid rgba(255,255,255,0.07); }
.help-trigger {
  width: 100%; background: none; border: none; color: rgba(255,255,255,0.8);
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0; font-size: 13px; cursor: pointer; font-family: var(--font-body);
  text-align: left; gap: 12px;
}
.help-trigger:hover { color: var(--white); }
.help-chevron { font-size: 18px; color: var(--accent); transition: transform 0.25s; flex-shrink: 0; }
.help-trigger.open .help-chevron { transform: rotate(90deg); }
.help-body {
  display: none; padding: 0 0 16px;
  font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.7;
}
.help-body.open { display: block; }
.help-body strong { color: rgba(255,255,255,0.9); }
.help-table {
  width: 100%; border-collapse: collapse; margin: 10px 0;
  font-size: 11px;
}
.help-table th, .help-table td {
  border: 1px solid rgba(255,255,255,0.1); padding: 5px 10px; text-align: left;
}
.help-table th { color: var(--accent); font-weight: 600; }
.help-steps { padding-left: 16px; margin: 8px 0; }
.help-steps li { margin-bottom: 6px; }
.help-bullets { padding-left: 14px; margin: 8px 0; }
.help-bullets li { margin-bottom: 6px; list-style: disc; }

/* ===== CUSTOM DESIGN GRID — 2x2 on mobile, 4-col on wide ===== */
.custom-design-grid {
  grid-template-columns: repeat(2, 1fr) !important;
}
@media (min-width: 900px) { .custom-design-grid { grid-template-columns: repeat(4, 1fr) !important; } }

/* ===== UPLOAD YOUR OWN DESIGN CARD ===== */
.upload-design-card { cursor: pointer; }
.upload-design-card:hover { box-shadow: 0 4px 20px rgba(8,247,247,0.15); border-color: var(--accent); }
.upload-design-thumb {
  width: 100%; height: 100%; min-height: 140px;
  background: linear-gradient(135deg, #060f10, #071a1a);
  border: 2px dashed rgba(8,247,247,0.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 16px; transition: border-color 0.2s;
}
.upload-design-card:hover .upload-design-thumb { border-color: var(--accent); }
.upload-design-icon { color: var(--accent); }
.upload-design-label {
  font-family: var(--font-display); font-size: 13px; letter-spacing: 0.14em;
  color: var(--accent);
}
.upload-design-sub { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; }
.upload-start-btn { background: var(--accent) !important; color: var(--black) !important; border-color: var(--accent) !important; }
.badge-custom-upload { background: #08f7f7 !important; color: #000 !important; }

/* ===== UPLOAD DESIGN MODAL ===== */
.upload-modal { max-width: 480px; }
.upload-drop-zone {
  border: 2px dashed rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
  padding: 28px 16px; text-align: center; cursor: pointer; margin: 20px 0 16px;
  transition: border-color 0.2s, background 0.2s; position: relative; min-height: 140px;
  display: flex; align-items: center; justify-content: center;
}
.upload-drop-zone:hover, .upload-drop-zone.drag-over {
  border-color: var(--accent); background: rgba(8,247,247,0.04);
}
.upload-prompt { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.upload-prompt-text { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.5; }
.upload-prompt-text span { color: var(--accent); }
.upload-prompt-hint { font-size: 10px; color: var(--grey-mid); }
.upload-preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.upload-preview-img { max-height: 160px; max-width: 100%; object-fit: contain; border-radius: 2px; }
.upload-remove-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--grey-mid); font-size: 11px; padding: 4px 12px; cursor: pointer; }
.upload-remove-btn:hover { color: var(--white); border-color: var(--white); }

.upload-form { display: flex; flex-direction: column; gap: 16px; }
.upload-field { display: flex; flex-direction: column; gap: 8px; }
.upload-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.upload-colour-row { display: flex; gap: 10px; align-items: center; }
.colour-opt {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform 0.15s, border-color 0.15s;
}
.colour-opt.active, .colour-opt:hover { transform: scale(1.18); border-color: var(--accent) !important; }
.upload-size-row { display: flex; gap: 6px; flex-wrap: wrap; }
.size-opt {
  background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
  padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: var(--font-body);
  transition: background 0.15s, color 0.15s;
}
.size-opt.active, .size-opt:hover { background: var(--accent); color: var(--black); border-color: var(--accent); }
.upload-qty-row { display: flex; align-items: center; gap: 16px; }
.qty-btn {
  width: 32px; height: 32px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: var(--white); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.qty-btn:hover { background: var(--accent); color: var(--black); border-color: var(--accent); }
.upload-qty-num { font-family: var(--font-display); font-size: 24px; color: var(--white); min-width: 28px; text-align: center; }
.upload-textarea {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: var(--white); padding: 10px 12px; font-size: 12px; resize: vertical;
  font-family: var(--font-body); line-height: 1.5;
}
.upload-textarea:focus { outline: none; border-color: var(--accent); }
.upload-tip { font-size: 11px; color: var(--grey-mid); line-height: 1.6; margin-top: 4px; }

/* ===== COMING SOON PLACEHOLDER CARDS ===== */
.coming-soon-card { opacity: 0.55; pointer-events: none; }
.coming-soon-thumb {
  width: 100%; aspect-ratio: 1; background: #f0f0eb;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
}
.coming-soon-icon { font-size: 38px; filter: grayscale(1); opacity: 0.4; }
.coming-soon-label {
  font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em;
  color: var(--grey-mid);
}

/* ===== MENU LINK BUTTONS (same look as <a> links) ===== */
button.menu-link {
  width: 100%; text-align: left; background: none; border: none;
  font-family: var(--font-body); font-size: 14px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; color: rgba(255,255,255,0.8);
  border-left: 2px solid transparent; cursor: pointer;
}
button.menu-link:hover { color: var(--white); border-left-color: var(--accent); background: rgba(255,255,255,0.03); }

/* ===== MENU INLINE HELP BOX ===== */
.menu-help-box {
  margin: 4px 20px 12px;
  background: rgba(8,247,247,0.06);
  border-left: 2px solid var(--accent);
  padding: 12px 14px;
  font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.7;
}
.menu-help-box strong { color: rgba(255,255,255,0.9); }
.menu-help-box ol { padding-left: 16px; margin: 6px 0; }
.menu-help-box li { margin-bottom: 4px; }

/* ===== SIZE PICKER MODAL ===== */
.size-picker-modal { max-width: 360px; padding: 28px 24px 32px; }
.sp-colour-bar { height: 4px; width: 60px; border-radius: 2px; margin-bottom: 16px; }
.sp-name { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.08em; margin-bottom: 4px; }
.sp-price { font-size: 18px; color: var(--accent); font-weight: 600; margin-bottom: 20px; }
.sp-label { font-size: 10px; letter-spacing: 0.24em; color: var(--accent); margin-bottom: 10px; }
.sp-sizes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sp-size-btn {
  width: 48px; height: 48px; border: 1.5px solid rgba(255,255,255,0.2);
  background: none; color: rgba(255,255,255,0.75);
  font-size: 14px; font-family: var(--font-body); cursor: pointer;
  transition: all 0.15s;
}
.sp-size-btn:hover { border-color: var(--accent); color: var(--white); }
.sp-size-btn.active { background: var(--accent); color: var(--black); border-color: var(--accent); font-weight: 700; }
.sp-size-guide { font-size: 10px; color: rgba(255,255,255,0.3); line-height: 1.6; margin-bottom: 20px; }
.sp-qty-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.sp-atc-btn { width: 100%; padding: 14px; font-size: 18px; }
.sp-view-cart {
  display: block; text-align: center; margin-top: 12px;
  font-size: 12px; letter-spacing: 0.2em; color: var(--accent);
}

/* ═══════════════════════════════════════════════════════
   PRODUCT PAGE  —  pixel-match screenshot
   ═══════════════════════════════════════════════════════ */

/* wrapper — no side padding so gallery is edge-to-edge */
.pp-wrap { max-width: 600px; margin: 0 auto; padding-bottom: 120px; }

/* ── Gallery ── */
.pp-gallery { position: relative; width: 100%; background: #f2f2f2; }
.pp-slides  { width: 100%; overflow: hidden; }
.pp-slide   { display: none; width: 100%; aspect-ratio: 1 / 1; }
.pp-slide.active { display: block; }
.pp-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-no-img  { width: 100%; aspect-ratio: 1; display: flex; align-items: center;
              justify-content: center; font-size: 80px; }
.pp-img-counter {
  position: absolute; bottom: 12px; right: 14px; z-index: 2;
  background: rgba(0,0,0,0.45); color: #fff; font-size: 12px;
  padding: 3px 10px; border-radius: 20px; letter-spacing: 0.04em;
}
.pp-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
           display: flex; gap: 6px; z-index: 2; }
.pp-dot  { width: 7px; height: 7px; border-radius: 50%;
           background: rgba(255,255,255,0.5); cursor: pointer; }
.pp-dot.active { background: #fff; }

/* ── Trust strip (green, below image) ── */
.pp-trust {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: #f0faf5; padding: 9px 14px;
  font-size: 12px; color: #2e7d32; font-weight: 600;
  border-bottom: 1px solid #c8e6c9;
}
.pp-trust-div { color: #aaa; font-weight: 300; }

/* ── Body padding ── */
.pp-body { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px; }

/* ── Delivery tag + title ── */
.pp-delivery-tag {
  font-size: 13px; line-height: 1.6; color: #333;
}
.pp-delivery-tag strong { color: #2e7d32; }
.pp-title-more { color: #999; }

/* ── Star seller row ── */
.pp-seller-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pp-star-badge {
  background: #4a0072; color: #fff;
  font-size: 11px; font-weight: 700; padding: 4px 11px;
  border-radius: 3px; letter-spacing: 0.04em;
}
.pp-rating-text { font-size: 12px; color: #555; }

/* ── Price area ── */
.pp-price-area { display: flex; flex-direction: column; gap: 3px; }
.pp-compare {
  font-size: 14px; color: #999; text-decoration: line-through;
}
.pp-price-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pp-lastday    { font-size: 13px; color: #e65100; font-weight: 600; }
.pp-price-est  {
  font-size: 30px; font-weight: 800; color: #e65100;
  font-family: var(--font-display); letter-spacing: 0.02em;
}
.pp-promo-line {
  font-size: 12px; color: #666;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.pp-off-badge {
  background: #fff3e0; border: 1.5px solid #e65100;
  color: #e65100; font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 2px;
}

/* ── Color block (thumbnail + label + swatch + qty + ATC) ── */
.pp-color-block {
  display: grid;
  grid-template-columns: 70px 1fr auto auto;
  grid-template-rows: auto auto;
  gap: 8px 10px;
  align-items: center;
  border: 1px solid #e8e8e8;
  padding: 10px;
  border-radius: 4px;
}
.pp-color-thumb-wrap {
  grid-row: 1 / 3;
  width: 70px; height: 70px;
  border: 1px solid #ddd; overflow: hidden; border-radius: 3px;
}
.pp-color-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-color-right { grid-column: 2; grid-row: 1 / 3; }
.pp-color-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.pp-color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.pp-swatch {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.15s;
}
.pp-swatch.sel  { border-color: var(--accent); transform: scale(1.15); }
.pp-qty {
  grid-column: 3; grid-row: 1 / 3;
  display: flex; align-items: center; border: 1px solid #ccc; height: 44px;
}
.pp-qty-btn {
  width: 34px; height: 44px; border: none; background: #f2f2f2;
  font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1;
}
.pp-qty-btn:active { background: #ddd; }
#ppQtyDisplay {
  width: 34px; text-align: center; font-weight: 600; font-size: 15px;
}
.pp-atc {
  grid-column: 4; grid-row: 1 / 3;
  background: #e65100; color: #fff;
  border: none; border-radius: 4px;
  padding: 0 16px; height: 44px;
  font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.pp-atc:active { background: #bf360c; }

/* ── Size block ── */
.pp-size-block { display: flex; flex-direction: column; gap: 6px; }
.pp-size-label  { font-size: 13px; font-weight: 600; }
.pp-size-row    { display: flex; gap: 8px; flex-wrap: wrap; }
.pp-size-btn {
  padding: 7px 18px; border: 1.5px solid #ccc; background: #fff;
  font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 3px;
}
.pp-size-btn.sel { border-color: var(--black); background: var(--black); color: #fff; }

/* ── Best selling badge ── */
.pp-best-badge {
  display: flex; align-items: center; gap: 6px;
  background: #1b5e20; color: #fff;
  font-size: 12px; padding: 10px 14px; border-radius: 3px;
}
.pp-best-badge span { color: rgba(255,255,255,0.8); }

/* ── Shipping info box ── */
.pp-ship-box {
  background: #f9fbe7; border: 1px solid #dce775;
  padding: 12px 14px; border-radius: 3px;
}
.pp-ship-title  { color: #2e7d32; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.pp-ship-detail { color: #555; font-size: 12px; line-height: 1.8; }

/* ── Urgency banner ── */
.pp-urgency {
  background: #e65100; color: #fff;
  padding: 14px 16px; border-radius: 3px;
  display: flex; flex-direction: column; gap: 3px; text-align: center;
}
.pp-urgency span:first-child { font-size: 15px; font-weight: 800; letter-spacing: 0.04em; }
.pp-urgency-sub { font-size: 11px; opacity: 0.85; }

/* ── Description toggle ── */
.pp-desc-toggle {
  border-top: 1px solid #eee; padding-top: 10px;
}
.pp-desc-toggle summary {
  font-size: 13px; font-weight: 600; cursor: pointer; color: #333;
  list-style: none; padding: 4px 0;
}
.pp-desc-body { font-size: 13px; line-height: 1.8; color: #555; padding: 10px 0; }

/* ── Sticky ATC bar ── */
.pp-sticky-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: #fff; border-top: 1px solid #ddd;
  transform: translateY(100%); transition: transform 0.25s ease;
  padding: 10px 14px; box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
}
.pp-sticky-bar.visible { transform: translateY(0); }
.pp-sticky-inner  { display: flex; align-items: center; gap: 10px; }
.pp-sticky-thumb  { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; flex-shrink:0; }
.pp-sticky-info   { flex: 1; min-width: 0; }
.pp-sticky-name   { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp-sticky-price  { font-size: 13px; color: #e65100; font-weight: 700; }
.pp-sticky-off    { font-size: 11px; color: #888; font-weight: 400; margin-left: 4px; }
.pp-sticky-atc {
  background: #e65100; color: #fff; border: none; border-radius: 4px;
  padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
}

/* desktop: keep image + info side by side on wide screens */
@media (min-width: 700px) {
  .pp-wrap { padding: 28px 16px 80px; }
  .pp-gallery { border-radius: 6px; overflow: hidden; max-width: 100%; }
}

/* ===== ADMIN UPLOAD ON PLACEHOLDER CARDS ===== */
.admin-slot-upload {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(8,247,247,0.9); color: #000;
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  padding: 5px 12px; border: none; cursor: pointer; white-space: nowrap;
  z-index: 10;
}
.admin-slot-upload:hover { background: var(--accent); }
.coming-soon-thumb { position: relative; }

/* ══ HELP BOTTOM-SHEET MODALS ═══════════════════════════════════════ */
.help-sheet-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 600;
}
.help-sheet-bg.open { display: block; }

.help-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #111;
  z-index: 700;
  border-radius: 20px 20px 0 0;
  padding: 12px 24px 44px;
  max-height: 82vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
  -webkit-overflow-scrolling: touch;
}
.help-sheet.open { transform: translateY(0); }

.help-sheet-handle {
  width: 40px; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  margin: 0 auto 18px;
}

.help-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.help-sheet-title {
  color: #fff;
  font-size: 19px;
  font-weight: 700;
  margin: 0;
  font-family: var(--font-display, sans-serif);
  letter-spacing: 0.04em;
}
.help-sheet-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.45);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 4px;
}
.help-sheet-close:hover { color: #fff; }

.help-sheet-body {
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  line-height: 1.75;
}
.help-sheet-body p { margin: 0 0 12px; }
.help-sheet-body ol {
  padding-left: 20px;
  line-height: 2;
  margin: 0 0 12px;
}
.help-sheet-body strong { color: #fff; }
.help-sheet-body a { color: #08f7f7; }

/* Sizing table */
.help-size-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-bottom: 12px;
}
.help-size-table th {
  color: #08f7f7;
  text-align: left;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-weight: 600;
}
.help-size-table td {
  padding: 9px 0;

// ── STATE ──────────────────────────────────────────────────────

  user: null,

};

// ── HELPERS ────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function token(){ return localStorage.getItem('100th_token'); }
function fmt(n){ return '₦' + Number(n).toLocaleString('en-NG', {minimumFractionDigits:0}); }

async function api(method, path, body){
  var opts = { method: method, headers: {'Content-Type':'application/json'} };
  if (token()) opts.headers['Authorization'] = 'Bearer ' + token();
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch('/api' + path, opts);
  var data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
var GET  = function(p){ return api('GET', p); };
var POST = function(p, b){ return api('POST', p, b); };
var DEL  = function(p){ return api('DELETE', p); };

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(12px)'; }, 2800);
}

function navigate(path){
  history.pushState({}, '', path);
  render();
}

function cartCount(){ return State.cart.reduce(function(s,i){ return s+i.qty; }, 0); }
function saveCart(){ localStorage.setItem('100th_cart', JSON.stringify(State.cart)); }

function updateCartBadge(){
  var badges = document.querySelectorAll('.cart-badge-count');
  badges.forEach(function(b){ b.textContent = cartCount() || 0; });
}

function onHexInput(inp){
  var v=inp.value.trim().toLowerCase();
  if(!v.startsWith('#')) v='#'+v;
  var prev=document.getElementById('hexPreview'); var lbl=document.getElementById('hexResultLabel');
  try{ if(prev) prev.style.background=v; }catch(e){}
  var colors=[{name:'Black',hex:'#060606'},{name:'White',hex:'#ffffff'},{name:'Teal Green',hex:'#08f7f7'},{name:'Carton',hex:'#bb8e51'}];
  var match=colors.find(function(c){return c.hex===v;});
  if(lbl){
    if(match){lbl.textContent='→ '+match.name+' T-Shirt';lbl.style.color=v==='#060606'?'#fff':v;}
    else if(v.length>=4){lbl.textContent='No exact match';lbl.style.color='rgba(255,255,255,0.4)';}
    else{lbl.textContent='Paste a hex code e.g. #08f7f7';lbl.style.color='rgba(255,255,255,0.3)';}
  }
}
function onHexEnter(inp){
  var v=inp.value.trim().toLowerCase();
  if(!v.startsWith('#')) v='#'+v;
  var colors=[{name:'Black',hex:'#060606'},{name:'White',hex:'#ffffff'},{name:'Teal Green',hex:'#08f7f7'},{name:'Carton',hex:'#bb8e51'}];
  if(colors.find(function(c){return c.hex===v;})) scrollToSection('tshirts-section');
}

// Banner editor logic
function openBannerEditor(){
  var p=document.getElementById('bannerEditorPanel'); if(p){p.style.display='block';}
  // Pre-fill from current slide text
  for(var i=1;i<=4;i++){
    var ey=document.getElementById('b'+i+'eyebrow'); var hl=document.getElementById('b'+i+'headline'); var sb=document.getElementById('b'+i+'sub');
    if(ey) document.getElementById('bedEyebrow'+i).value=ey.textContent;
    if(hl) document.getElementById('bedHeadline'+i).value=hl.innerText.replace(/\n/g,' ');
    if(sb) document.getElementById('bedSub'+i).value=sb.textContent;
  }
}
function closeBannerEditor(){ var p=document.getElementById('bannerEditorPanel'); if(p) p.style.display='none'; }
function bedTab(btn,idx){
  document.querySelectorAll('.bed-tab').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.bed-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active'); document.querySelectorAll('.bed-panel')[idx].classList.add('active');
}
var _bedImgData = {};
function bedPickImg(input, num){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var prev=document.getElementById('bedImgPreview'+num); var prm=document.getElementById('bedImgPrompt'+num);
    if(prev){prev.src=e.target.result;prev.style.display='block';}
    if(prm) prm.style.display='none';
    _bedImgData[num]=e.target.result;
    // Live apply to slide
    var slide=document.getElementById('bannerSlide'+num);
    if(slide){
      var existing=slide.querySelector('img.banner-bg-img');
      if(existing){existing.src=e.target.result;}else{
        var img=document.createElement('img');img.className='banner-bg-img';
        img.src=e.target.result;img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.55;';
        var fb=slide.querySelector('.banner-bg-fallback');
        if(fb){slide.insertBefore(img,fb);fb.style.display='none';}else{slide.insertBefore(img,slide.firstChild);}
      }
    }
  };
  reader.readAsDataURL(file);
}
async function bedSave(num){
  var eye=document.getElementById('bedEyebrow'+num).value.trim();
  var headline=document.getElementById('bedHeadline'+num).value.trim();
  var sub=document.getElementById('bedSub'+num).value.trim();
  var imageData=_bedImgData[num]||null;
  try {
    var payload={slot:num,eye:eye,heading:headline,sub:sub};
    if(imageData){ var r=await POST('/upload',{image:imageData,folder:'100th-banners'}); payload.image_url=r.url; }
    await POST('/banners',payload);
    // Apply text live
    var ey=document.getElementById('b'+num+'eyebrow'); var hl=document.getElementById('b'+num+'headline'); var sb=document.getElementById('b'+num+'sub');
    if(ey&&eye) ey.textContent=eye;
    if(hl&&headline) hl.innerHTML=headline.replace(/\\n/g,'<br>');
    if(sb&&sub) sb.textContent=sub;
    showToast('✅ Slide '+num+' saved!');
  } catch(e){ showToast('Error: '+e.message); }
}
